# Trunk configuration for the Memoire ORM website.
# Build:  trunk build --release      Dev server:  trunk serve --open
[build]
target = "index.html"
dist = "dist"
public_url = "/"
filehash = true
# No minification: Trunk's JS minifier chokes on the wasm-bindgen glue (harmless
# but noisy warning). Everything is compressed (gzip / brotli) when served anyway.
minify = "never"

[serve]
addresses = ["127.0.0.1"]
port = 8080

[tools]
# wasm-bindgen-cli is picked automatically to match the version in Cargo.lock.
# wasm-opt is pinned so local and Docker builds produce the same output; the
# feature flags it needs are passed with `data-wasm-opt-params` in index.html.
wasm_opt = "version_123"
