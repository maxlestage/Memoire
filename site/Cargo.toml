[package]
name = "memoire-site"
version = "0.1.0"
edition = "2024"
publish = false
description = "Presentation website and documentation of Memoire ORM, written with active: server-rendered pages, WebAssembly islands, installable and offline (PWA)."
license-file = "../LICENSE"

# Standalone project: not part of the root workspace.
[workspace]

# The library holds what both sides share: texts, routes, documentation titles, search
# and the islands (the playground runs the real ORM). Compiled to WebAssembly it is the
# browser bundle. The binary is the web server, and `memoire-site export <dir>` writes
# the whole site as static files (GitHub Pages).
[lib]
name = "memoire_site"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "memoire-site"
path = "src/main.rs"

[dependencies]
active = { git = "https://github.com/maxlestage/Active" }
# The real ORM: run by the playground in the browser (WebAssembly) and on the server,
# which renders the playground's first results.
memoire-orm = { path = "../crates/memoire-orm", default-features = false, features = ["memory"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The web server: Vitesse, with Brotli and gzip for the pages and the search indexes.
vitesse = { git = "https://github.com/maxlestage/Vitesse", default-features = false, features = ["compress"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
# Static files are compressed once (brotli, gzip), not on every request.
brotli = "9"
flate2 = "1"
# Content-Security-Policy: hashes of the inline scripts of each page.
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
active = { git = "https://github.com/maxlestage/Active", features = ["client"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlInputElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "Performance",
  "PointerEvent",
  "Response",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "Storage",
  "Window",
] }

[dev-dependencies]
# Checks that the web app manifest and the service worker's lists are valid JSON.
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `#[tokio::test]`: the tests call the server through Vitesse's test client.
tokio = { version = "1", features = ["macros", "rt"] }

# Browser bundle: `cargo build --lib --target wasm32-unknown-unknown --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Server.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
