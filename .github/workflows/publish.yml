name: Publish to crates.io

# Releases on its own: once CI is green on master, a version of the root Cargo.toml
# that has no tag yet gets its tag (v0.1.0 for 0.1.0) and its GitHub release, with
# the notes of its section in CHANGELOG.md, then both crates are published. Nothing
# to fill in by hand:
#   1. bump `version` in the root Cargo.toml (and the `=x.y.z` pin of memoire-orm-derive),
#   2. write its section in CHANGELOG.md, push.
# A pull request merged by the auto-merge of ci.yml reaches master without starting CI
# there (a merge made with GITHUB_TOKEN starts no workflow): the auto-merge then runs
# this workflow itself, with `release`, after the merge.
# A GitHub release created by hand with the tag `vX.Y.Z` (or a pushed tag) publishes too.
# Requires the repository secret CARGO_REGISTRY_TOKEN (crates.io → Account Settings → API Tokens);
# without it, the automatic release still tags the version and creates its GitHub release.
# Already-published crates are skipped, so re-running the workflow is safe.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only package and verify, do not upload"
        type: boolean
        default: true
      release:
        description: "Release the version of master if it has no tag yet (what the auto-merge runs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the new version
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Release the workspace version if it is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "memoire-orm") | .version')
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists: nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The notes: the section of this version in CHANGELOG.md.
          awk -v head="## [${version}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "${tag}" --target "${SHA}" --title "${tag}" --notes-file notes.md
          else
            gh release create "${tag}" --target "${SHA}" --title "${tag}" --generate-notes
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ [${tag}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}) released" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: tag
    # `needs` skips this job for the other events unless `always()` lets them through.
    if: >-
      always() &&
      (needs.tag.outputs.created == 'true' ||
      (github.event_name != 'workflow_run' && !inputs.release))
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read the workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "memoire-orm") | .version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Workspace version: ${version}"
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${ref#v}" != "${version}" ]]; then
            echo "::error::Tag ${ref} does not match the crate version ${version}. Bump the version in Cargo.toml first."
            exit 1
          fi

      # On the automatic release, a missing token only postpones the publication.
      - name: Ready to publish
        id: ready
        run: |
          if [ "${{ github.event_name == 'workflow_run' || inputs.release }}" = "true" ] && [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::Released on GitHub; add the CARGO_REGISTRY_TOKEN secret to publish on crates.io too, then run this workflow by hand."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.ready.outputs.ready == 'true'
        run: cargo test --workspace --features memory,sqlite

      - name: Dry run
        if: steps.ready.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.release
        run: cargo publish --workspace --dry-run

      - name: Publish
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run || inputs.release)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN repository secret (crates.io → Account Settings → API Tokens)."
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"
          for crate in memoire-orm-derive memoire-orm; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "memoire-orm-release (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "$status" = "200" ]; then
              echo "${crate} ${version} is already on crates.io, skipping"
            else
              cargo publish -p "${crate}"
            fi
          done
          echo "### 📦 Published memoire-orm ${version}: https://crates.io/crates/memoire-orm/${version}" >> "$GITHUB_STEP_SUMMARY"
