name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"

jobs:
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests (memory, SQLite, PostgreSQL, MySQL, Redis, MongoDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memoire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: memoire_test
          MARIADB_USER: memoire
          MARIADB_PASSWORD: memoire
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MEMOIRE_PG_URL: postgres://postgres:postgres@localhost:5432/memoire_test
      MEMOIRE_MYSQL_URL: mysql://memoire:memoire@127.0.0.1:3306/memoire_test
      MEMOIRE_REDIS_URL: redis://127.0.0.1:6379
      MEMOIRE_MONGO_URL: mongodb://127.0.0.1:27017/?directConnection=true
      MEMOIRE_MONGO_STANDALONE_URL: mongodb://127.0.0.1:27018/
    steps:
      - uses: actions/checkout@v5
      - name: Start MongoDB (replica set + standalone)
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          docker run -d --name mongo-standalone -p 27018:27017 mongo:7
          for i in $(seq 1 60); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping: 1}).ok' > /dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for i in $(seq 1 60); do
            state=$(docker exec mongo-rs mongosh --quiet --eval 'rs.status().members[0].stateStr' 2>/dev/null || true)
            if [ "$state" = "PRIMARY" ]; then echo "MongoDB replica set ready"; break; fi
            sleep 1
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests, all features, every backend
        run: cargo test --workspace --all-features
      - name: Tests, default features
        run: cargo test -p memoire-orm
      - name: Examples
        run: |
          cargo run -p memoire-orm --example quickstart
          cargo run -p memoire-orm --example blog
          cargo run -p memoire-orm --example sqlite --features sqlite
          DATABASE_URL="$MEMOIRE_PG_URL" cargo run -p memoire-orm --example postgres --features postgres
      - name: Same code on every backend
        run: |
          for url in memory sqlite::memory: "$MEMOIRE_PG_URL" "$MEMOIRE_MYSQL_URL" "$MEMOIRE_REDIS_URL" "$MEMOIRE_MONGO_URL"; do
            cargo run -p memoire-orm --example any_backend --features full -- "$url"
          done

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Each backend on its own
        run: |
          for f in memory sqlite postgres postgres-tls mysql mysql-tls redis redis-tls mongodb chrono,uuid,json; do
            echo "::group::--no-default-features --features $f"
            cargo clippy -p memoire-orm --no-default-features --features "$f" --all-targets -- -D warnings
            echo "::endgroup::"
          done

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p memoire-orm --all-features

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p memoire-orm --target wasm32-unknown-unknown --features chrono,uuid,json

  package:
    name: crates.io dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run

  site:
    name: Website (Yew + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            site
            server
      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"
          trunk --version
      - name: Build the site
        working-directory: site
        run: trunk build --release
      - name: Build the server
        working-directory: server
        run: cargo build --release

  # Pull requests targeting master are merged automatically once every check
  # is green. Merges made with GITHUB_TOKEN do not start new workflows, so the
  # Heroku deployment is triggered explicitly afterwards.
  auto-merge:
    name: Auto-merge into master
    needs: [lint, test, features, msrv, wasm, package, site]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
      - name: Trigger the Heroku deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-heroku.yml --ref master --repo "$GITHUB_REPOSITORY"
