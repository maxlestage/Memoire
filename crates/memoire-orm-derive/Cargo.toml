[package]
name = "memoire-orm-derive"
description = "Derive macros (`Model`, `FromRow`) for the Memoire ORM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/memoire-orm-derive"
readme = "README.md"
keywords = ["orm", "derive", "sql", "database", "macro"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
