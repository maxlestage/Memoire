[package]
name = "memoire-orm"
description = "A blazing-fast, type-safe, async ORM in pure Rust for SQL and NoSQL: PostgreSQL, MySQL/MariaDB, SQLite, Redis, MongoDB and an in-memory engine that runs in WebAssembly. Compile-time SQL, zero-cost row mapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/memoire-orm"
readme = "README.md"
keywords = ["orm", "database", "sql", "nosql", "async"]
categories = ["database", "asynchronous", "wasm", "data-structures"]
exclude = ["benches/results/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["memory"]
## In-memory storage engine (pure Rust, works on wasm32).
memory = ["dep:parking_lot", "dep:foldhash", "dep:hashbrown"]
## SQLite backend (via rusqlite, SQLite is compiled in).
sqlite = ["dep:rusqlite", "dep:async-lock"]
## PostgreSQL backend (tokio-postgres + deadpool connection pool).
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:tokio", "dep:bytes"]
## MySQL / MariaDB backend (mysql_async, pure Rust, requires Tokio).
mysql = ["dep:mysql_async", "dep:async-lock"]
## TLS for MySQL / MariaDB (rustls + ring), e.g. `mysql://...?require_ssl=true`.
mysql-tls = ["mysql", "mysql_async/default-rustls-ring"]
## Redis backend (redis-rs, requires Tokio). Rows are JSON documents in hashes;
## queries are evaluated by the in-memory engine.
redis = ["memory", "dep:redis", "dep:serde_json", "dep:async-lock"]
## TLS for Redis (`rediss://` URLs; append `#insecure` for self-signed certificates
## such as Heroku Key-Value Store).
redis-tls = ["redis", "redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots", "redis/tls-rustls-insecure", "dep:rustls"]
## MongoDB backend (official driver, requires Tokio). Filters, sorting and
## pagination run in MongoDB; joins and GROUP BY are finished by the in-memory engine.
mongodb = ["memory", "dep:mongodb", "dep:serde_json", "dep:async-lock"]
## TLS for PostgreSQL (rustls, `sslmode=require|verify-ca|verify-full`), needed by
## Heroku Postgres and most managed databases.
postgres-tls = ["postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]
## Encryption of `MemoryDb` storage files (AES-256-GCM, key derived from a password
## with Argon2id).
encryption = ["memory", "dep:aes-gcm", "dep:argon2"]
## Browser storage: `web::Store`, a state store in the spirit of Pinia, and
## `web::LocalStorageDb`, a Memoire database kept in `localStorage`. They use the
## browser on wasm32; `web::MemoryStorage` works everywhere (tests, server rendering).
web = ["memory", "dep:serde", "dep:serde_json", "dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
## `chrono` date/time types.
chrono = ["dep:chrono", "tokio-postgres?/with-chrono-0_4"]
## `uuid::Uuid` support.
uuid = ["dep:uuid", "tokio-postgres?/with-uuid-1"]
## JSON columns (`serde_json::Value` and `Json<T>`).
json = ["dep:serde", "dep:serde_json", "tokio-postgres?/with-serde_json-1"]
## Everything.
full = ["memory", "encryption", "web", "sqlite", "postgres", "postgres-tls", "mysql", "mysql-tls", "redis", "redis-tls", "mongodb", "chrono", "uuid", "json"]

[dependencies]
memoire-orm-derive.workspace = true
thiserror = "2"

parking_lot = { version = "0.12", optional = true }
foldhash = { version = "0.2", optional = true }
hashbrown = { version = "0.16", optional = true, default-features = false }

rusqlite = { version = "0.40", optional = true, features = ["bundled", "functions"] }
async-lock = { version = "3", optional = true }

tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }
bytes = { version = "1", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
mongodb = { version = "3.9", optional = true }
redis = { version = "1.7", optional = true, default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
mysql_async = { version = "0.37", optional = true, default-features = false, features = ["minimal-rust"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }

aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }

chrono = { version = "0.4", optional = true, default-features = false, features = ["std", "clock"] }
uuid = { version = "1", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage", "StorageEvent", "Event", "EventTarget"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "orm"
harness = false
required-features = ["memory", "sqlite"]

[[example]]
name = "quickstart"
required-features = ["memory"]

[[example]]
name = "sqlite"
required-features = ["sqlite"]

[[example]]
name = "postgres"
required-features = ["postgres"]

[[example]]
name = "blog"
required-features = ["memory"]

[[example]]
name = "any_backend"
required-features = ["full"]
