[workspace]
resolver = "3"
members = ["crates/memoire-orm", "crates/memoire-orm-derive"]
exclude = ["site"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
homepage = "https://memoire-7f4525f1fdaf.herokuapp.com/"
repository = "https://github.com/maxlestage/Memoire"
authors = ["Maxime Nathan Lestage"]

[workspace.dependencies]
memoire-orm-derive = { version = "=0.2.1", path = "crates/memoire-orm-derive" }
memoire-orm = { version = "=0.2.1", path = "crates/memoire-orm", default-features = false }

[profile.bench]
debug = false
lto = "thin"
codegen-units = 1
