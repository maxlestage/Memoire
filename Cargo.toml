[workspace]
resolver = "3"
members = ["crates/memoire-orm", "crates/memoire-orm-derive"]
exclude = ["site"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
homepage = "https://maxlestage.github.io/Memoire/"
repository = "https://github.com/maxlestage/Memoire"
authors = ["Maxime Nathan Lestage"]

[workspace.dependencies]
memoire-orm-derive = { version = "=0.1.0", path = "crates/memoire-orm-derive" }

[profile.bench]
debug = false
lto = "thin"
codegen-units = 1
