[workspace]
resolver = "3"
members = ["crates/memoire-orm", "crates/memoire-orm-derive"]
exclude = ["site", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxlestage/Memoire"
homepage = "https://github.com/maxlestage/Memoire"
authors = ["Memoire ORM contributors"]

[workspace.dependencies]
memoire-orm-derive = { version = "=0.1.0", path = "crates/memoire-orm-derive" }

[profile.bench]
debug = false
lto = "thin"
codegen-units = 1
